name: Construir y Publicar Frontend

on:
  push:
    branches: ["main", "master"]
  workflow_dispatch:

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

jobs:
  construir-y-publicar:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
      attestations: write
      id-token: write

    steps:
      - name: Descargar repositorio
        uses: actions/checkout@v4

      - name: Configurar Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Iniciar sesión en GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Resolver variables de compilación
        env:
          API_BASE_URL_FROM_VAR: ${{ vars.VITE_API_BASE_URL }}
          API_BASE_URL_FROM_SECRET: ${{ secrets.VITE_API_BASE_URL }}
        run: |
          VITE_API_BASE_URL="${API_BASE_URL_FROM_VAR:-$API_BASE_URL_FROM_SECRET}"

          if [ -z "$VITE_API_BASE_URL" ]; then
            echo "Falta VITE_API_BASE_URL en Actions Variables o Secrets."
            exit 1
          fi

          echo "VITE_API_BASE_URL=$VITE_API_BASE_URL" >> "$GITHUB_ENV"

      - name: Extraer metadatos para Docker
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=raw,value=latest,enable={{is_default_branch}}
            type=ref,event=branch
            type=sha,format=short

      - name: Construir y empujar imagen Linux
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: |
            VITE_API_BASE_URL=${{ env.VITE_API_BASE_URL }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          sbom: true
          provenance: true

      - name: Notificar a Dokploy para redespliegue
        if: success()
        env:
          DOKPLOY_WEBHOOK_URL: ${{ secrets.DOKPLOY_WEBHOOK_URL }}
        run: |
          if [ -n "$DOKPLOY_WEBHOOK_URL" ]; then
            echo "Notificando a Dokploy para redesplegar el contenedor..."
            CODIGO_RESPUESTA=$(curl -X POST -s -o /dev/null -w "%{http_code}" "$DOKPLOY_WEBHOOK_URL")
            echo "Respuesta de Dokploy: $CODIGO_RESPUESTA"
          else
            echo "DOKPLOY_WEBHOOK_URL no configurado en Secrets. Puedes agregarlo en Settings > Secrets and variables > Actions."
          fi
